name: External status heartbeat

on:
  schedule:
    - cron: '23 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: external-status-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record benign repository activity
        shell: bash
        run: |
          printf '%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > .status-monitor-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .status-monitor-heartbeat
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: keep status monitor schedule active"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
